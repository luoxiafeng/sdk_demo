{% extends "base.html" %}

{% block title %}设备信息{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row" style="height: 40vh;">
        <div class="col-12" style="width: 70%; margin: 0 auto;">
            <h2 class="mb-3">设备信息</h2>
            <table class="table table-bordered">
                <tr>
                    <th>设备标识</th>
                    <td colspan="4">RJ-BMOX-000738FADB3FA28829232CA9F49C0329</td>
                </tr>
                <tr>
                    <th>授权状态</th>
                    <td>已授权</td>
                    <th>软件版本</th>
                    <td>0.0.54</td>
                    <td>
                        <form id="uploadForm" enctype="multipart/form-data">
                            <input type="file" id="fileInput" style="display: none;" />
                            <button type="button" class="btn btn-primary btn-sm" onclick="document.getElementById('fileInput').click()">更新版本</button>
                        </form>
                    </td>
                </tr>
                <tr>
                    <th>资源信息</th>
                    <td colspan="4">存储空间 (10.8GB) 芯片温度 (45°C)</td>
                </tr>
                <tr>
                    <th>系统版本</th>
                    <td>BM1684-16 2.7.0</td>
                    <th>盒子时间</th>
                    <td>2024-07-09 10:11:32</td>
                    <td><button class="btn btn-primary btn-sm">同步时间</button></td>
                </tr>
                <tr>
                    <th>操作</th>
                    <td colspan="4">
                        <div class="d-flex justify-content-between">
                            <button class="btn btn-info btn-sm">更新密钥</button>
                            <div>
                                <button class="btn btn-warning btn-sm">重启服务</button>
                                <button class="btn btn-danger btn-sm">重启设备</button>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <div class="row" style="height: 60vh; width: 70%; margin: 0 auto;">
        <div class="col-lg-6 col-md-12 mb-4">
            <canvas id="chart1" style="height: 100%;"></canvas>
        </div>
        <div class="col-lg-6 col-md-12 mb-4">
            <canvas id="chart2" style="height: 100%;"></canvas>
        </div>
        <div class="col-lg-6 col-md-12 mb-4">
            <canvas id="chart3" style="height: 100%;"></canvas>
        </div>
        <div class="col-lg-6 col-md-12 mb-4">
            <canvas id="chart4" style="height: 100%;"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const labels = ['2024/7/9 10:11:16', '2024/7/9 10:11:21', '2024/7/9 10:11:26', '2024/7/9 10:11:31'];

    const data1 = {
        labels: labels,
        datasets: [{
            label: '芯片温度 (C)',
            data: [45, 45, 45, 45],
            borderColor: 'blue',
            fill: true,
            tension: 0.1
        }]
    };

    const data2 = {
        labels: labels,
        datasets: [{
            label: 'CPU内存使用率 (%)',
            data: [20, 20, 20, 20],
            borderColor: 'blue',
            fill: true,
            tension: 0.1
        }]
    };

    const data3 = {
        labels: labels,
        datasets: [{
            label: 'NPU使用率 (%)',
            data: [50, 55, 50, 50],
            borderColor: 'blue',
            fill: true,
            tension: 0.1
        }]
    };

    const data4 = {
        labels: labels,
        datasets: [{
            label: 'TPU内存使用率 (%)',
            data: [5, 6, 7, 7],
            borderColor: 'blue',
            fill: true,
            tension: 0.1
        }]
    };
    document.getElementById('fileInput').addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const formData = new FormData();
            formData.append('file', file);
    
            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('上传失败');
            });
        }
    });
    
    new Chart(document.getElementById('chart1'), { type: 'line', data: data1 });
    new Chart(document.getElementById('chart2'), { type: 'line', data: data2 });
    new Chart(document.getElementById('chart3'), { type: 'line', data: data3 });
    new Chart(document.getElementById('chart4'), { type: 'line', data: data4 });
</script>
{% endblock %}
