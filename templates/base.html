<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}设备信息管理{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .active {
            color: #fff; /* 选中项的字体颜色 */
            font-weight: bold; /* 选中项的加粗 */
            background-color: green; /* 选中项的背景颜色 */
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- 侧边栏 -->
        <nav id="sidebar" class="bg-dark text-light" style="width: 200px; position: fixed; height: 100vh;">
            <div class="sidebar-header text-center py-3">
                <h4>设备信息</h4>
            </div>
            <ul class="list-unstyled px-2">
                <li><a href="/" id="basic-info-link" class="text-light d-block py-2">基本信息</a></li>
                <li><a href="#" id="channel-management-link" class="text-light d-block py-2">通道管理</a></li>
                <li><a href="#" id="task-management-link" class="text-light d-block py-2">任务管理</a></li>
                <li><a href="#" id="live-preview-link" class="text-light d-block py-2">实时预览</a></li>
                <li><a href="#" id="9-preview-link" class="text-light d-block py-2">9宫格</a></li>
                <li><a href="#" id="alarm-management-link" class="text-light d-block py-2">告警管理</a></li>
                <li><a href="#" id="model-settings-link" class="text-light d-block py-2">模型配置</a></li>
                <li><a href="http://192.168.25.128:9090" target="_blank" id="system-management-link" class="text-light d-block py-2">系统管理</a></li>
            </ul>
        </nav>

        <!-- 页面内容 -->
        <div id="content" class="p-4" style="margin-left: 200px;">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取当前 URL
            const currentUrl = window.location.pathname;

            // 处理侧边栏的跳转
            const links = [
                { id: 'basic-info-link', url: '/' }, // 添加基本信息的链接
                { id: 'channel-management-link', url: '/channel_management' },
                { id: 'task-management-link', url: '/task_management' },
                { id: 'live-preview-link', url: '/live_preview' },
                { id: '9-preview-link', url: '/nine_tables' },
                { id: 'alarm-management-link', url: '/alarm_management' },
                { id: 'model-settings-link', url: '/model_settings' },
                { id: 'system-management-link', url: 'http://192.168.25.128:9090' } // 系统管理链接
            ];

            links.forEach(link => {
                // 点击事件
                document.getElementById(link.id).addEventListener('click', function(event) {
                    event.preventDefault(); // 阻止默认行为
                    // 移除其他链接的活跃状态
                    links.forEach(l => {
                        document.getElementById(l.id).classList.remove('active');
                    });
                    // 添加当前链接的活跃状态
                    this.classList.add('active');
                    // 跳转到目标页面
                    window.location.href = link.url;
                });

                // 高亮当前链接
                if (currentUrl === link.url) {
                    document.getElementById(link.id).classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
