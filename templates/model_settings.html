{% extends 'base.html' %}

{% block content %}
<div class="container" style="width: 100%;">

    <!-- 定义2x1的表格布局 -->
    <table style="width: 100%; height: 100%;">
        <tr>
            <!-- 第一行，包含文件上传表单 -->
            <td style="vertical-align: top;">
                <form method="POST" action="/upload_model" enctype="multipart/form-data" style="display: flex; align-items: center;">
                    <div class="form-group" style="margin-right: 10px;">
                        <label for="fileUpload" class="sr-only">上传模型文件：</label>
                        <input type="file" name="file" class="form-control-file" id="fileUpload" onchange="checkFile()">
                    </div>
                    <button type="submit" class="btn btn-primary" id="uploadButton" disabled>上传</button>
                </form>
            </td>
        </tr>

        <tr>
            <!-- 第二行，包含数据库内容展示表格 -->
            <td style="vertical-align: top;">
                <table class="table" style="width: 100%; table-layout: fixed; margin-top: 20px;">
                    <thead>
                        <tr>
                            <th style="width: 15%; padding-left: 10px; padding-top: 15px; padding-bottom: 15px;">文件</th>
                            <th style="width: 15%; padding: 15px;">涉及算法</th>
                            <th style="width: 15%; padding: 15px;">版本日期</th>
                            <th style="width: 35%; padding: 15px;">算法描述</th>
                            <th style="width: 20%; padding: 15px;">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for model in models %}
                        <tr>
                            <td id="filename-{{ model.id }}" style="padding-left: 10px; padding-top: 15px; padding-bottom: 15px;">{{ model.filename }}</td>
                            <td style="padding: 15px;">{{ model.algorithm }}</td>
                            <td style="padding: 15px;">{{ model.upload_date }}</td>
                            <td style="padding: 15px;">{{ model.description }}</td>
                            <td style="padding: 15px;">
                                <!-- 删除按钮 -->
                                <form method="POST" action="/delete_model/{{ model.id }}" style="display:inline-block; margin-right: 5px;">
                                    <button type="submit" class="btn btn-danger">删除</button>
                                </form>

                                <!-- 覆盖按钮 -->
                                <form method="POST" action="/overwrite_model/{{ model.id }}" enctype="multipart/form-data" style="display:inline-block;">
                                    <input type="file" name="file" class="form-control-file" id="overwriteFile-{{ model.id }}" style="display:none;" onchange="checkOverwriteFile({{ model.id }})">
                                    <button type="button" class="btn btn-warning" onclick="document.getElementById('overwriteFile-{{ model.id }}').click();">覆盖</button>
                                    <button type="submit" class="btn btn-success" id="overwriteButton-{{ model.id }}" disabled style="display: none;">确认上传</button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </td>
        </tr>
    </table>
</div>

<!-- JavaScript 检测文件选择并控制上传按钮 -->
<script>
    function checkFile() {
        var fileInput = document.getElementById('fileUpload');
        var uploadButton = document.getElementById('uploadButton');
        if (fileInput.files.length > 0) {
            uploadButton.disabled = false;  // 启用上传按钮
        } else {
            uploadButton.disabled = true;  // 禁用上传按钮
        }
    }

    function checkOverwriteFile(modelId) {
        var fileInput = document.getElementById('overwriteFile-' + modelId);
        var overwriteButton = document.getElementById('overwriteButton-' + modelId);
        var currentFileName = document.getElementById('filename-' + modelId).innerText.trim();
        var selectedFileName = fileInput.files[0].name;

        if (selectedFileName === currentFileName) {
            overwriteButton.style.display = 'inline-block';  // 显示确认上传按钮
            overwriteButton.disabled = false;  // 启用上传按钮
        } else {
            // 使用 alert 弹出错误消息框
            alert('文件名不匹配，请选择与当前文件相同的文件进行覆盖！');
            overwriteButton.style.display = 'none';  // 隐藏确认上传按钮
        }
    }
</script>
{% endblock %}
