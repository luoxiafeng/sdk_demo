{% extends "base.html" %}
{% block title %}任务管理{% endblock %}

{% block content %}

<table class="table table-bordered align-middle">
    <thead>
        <tr>
            <th style="width: 50px;">行号</th>
            <th>任务名称</th>
            <th>视频源</th>
            <th>上报地址</th>
            <th>算法设置</th>
            <th>任务状态</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {% for i in range(1, 17) %}
        <tr>
            <td>{{ i }}</td>
            <td>
                <input type="text" class="form-control" value="{{ tasks[i - 1].task_name if tasks|length >= i else '' }}" readonly>
            </td>
            <td>
                <select class="form-select" style="width: 150px;" disabled>
                    <option value="">请选择视频源</option>
                    {% for channel in channels %}
                        <option value="{{ channel.channel_number }}" {% if channel.channel_number == (tasks[i - 1].video_source if tasks|length >= i else '') %}selected{% endif %}>
                            {{ channel.channel_number }} - {{ channel.camera_name }}
                        </option>
                    {% endfor %}
                </select>
            </td>
            <td>
                <input type="text" class="form-control" value="{{ tasks[i - 1].report_address if tasks|length >= i else '' }}" readonly>
            </td>
            <td>
                <!-- 单次选择算法下拉列表，默认隐藏 -->
                <select class="form-select algorithm-select" id="algorithm-select-{{ i }}" style="width: 150px; display: none;" onchange="updateAlgorithmConfig({{ i }}, this)">
                    <option value="">请选择算法</option>
                    {% for model in models %}
                        <option value="{{ model.id }}">{{ model.filename }}</option>
                    {% endfor %}
                </select>
                
                <!-- 用于显示选择的算法配置 -->
                <div id="algorithm-config-{{ i }}" class="algorithm-config"></div>
            </td>
            <td>
                <span class="badge bg-primary">{% if tasks|length >= i %}{{ tasks[i - 1].status }}{% else %}未开始{% endif %}</span>
            </td>
            <td>
                <button class="btn btn-info btn-sm edit-button">编辑</button>
                <button class="btn btn-success btn-sm">启动</button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
    // 编辑按钮逻辑
    document.querySelectorAll('.edit-button').forEach(button => {
        button.addEventListener('click', function() {
            const row = this.closest('tr');
            const inputs = row.querySelectorAll('input, select');
            const isEditing = this.textContent === '保存';
            const algorithmSelect = row.querySelector('.algorithm-select');

            // 切换可编辑状态
            inputs.forEach(input => {
                if (input.tagName === 'INPUT') {
                    input.readOnly = isEditing ? true : false;
                }
                if (input.tagName === 'SELECT' && !input.classList.contains('algorithm-select')) {
                    input.disabled = isEditing ? true : false;
                }
            });

            // 显示或隐藏算法选择下拉框
            if (isEditing) {
                algorithmSelect.style.display = 'none';  // 隐藏算法下拉列表
            } else {
                algorithmSelect.style.display = 'block'; // 显示算法下拉列表
            }

            // 更新按钮文本
            this.textContent = isEditing ? '编辑' : '保存';
        });
    });

    // 更新算法配置：用户每次选择一个算法后，显示在配置单元格中
    function updateAlgorithmConfig(rowId, selectElement) {
        const selectedAlgorithm = selectElement.options[selectElement.selectedIndex].textContent;
        const configDiv = document.getElementById(`algorithm-config-${rowId}`);

        // 现有的算法配置
        let currentConfig = configDiv.textContent.trim();
        if (currentConfig) {
            currentConfig += `, "${selectedAlgorithm}"`;
        } else {
            currentConfig = `"${selectedAlgorithm}"`;
        }

        // 更新显示
        configDiv.textContent = currentConfig;
    }
</script>

<style>
    .table {
        table-layout: auto;
        width: 100%;
    }
    .table th, .table td {
        vertical-align: middle;
    }
    .form-control, .form-select {
        width: 100%; /* 确保输入框和选择框宽度一致 */
        box-sizing: border-box; /* 确保内边距不会影响宽度 */
    }
    .algorithm-config {
        margin-top: 5px;
        font-size: 12px;
        color: #555;
    }
</style>

{% endblock %}
