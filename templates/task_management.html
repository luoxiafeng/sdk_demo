{% extends "base.html" %}
{% block title %}任务管理{% endblock %}

{% block content %}

<table class="table table-bordered align-middle">
    <thead>
        <tr>
            <th style="width: 50px;">行号</th>
            <th>任务名称</th>
            <th>视频源</th>
            <th>上报地址</th>
            <th>执勤计划</th>
            <th>任务状态</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {% for i in range(1, 17) %}
        <tr>
            <td>{{ i }}</td>
            <td>
                <input type="text" class="form-control" value="{{ tasks[i - 1].task_name if tasks|length >= i else '' }}" readonly>
            </td>
            <td>
                <select class="form-select" style="width: 150px;" disabled>
                    <option value="">请选择视频源</option>
                    {% for channel in channels %}
                        <option value="{{ channel.channel_number }}" {% if channel.channel_number == (tasks[i - 1].video_source if tasks|length >= i else '') %}selected{% endif %}>
                            {{ channel.channel_number }} - {{ channel.camera_name }}
                        </option>
                    {% endfor %}
                </select>
            </td>
            <td>
                <input type="text" class="form-control" value="{{ tasks[i - 1].report_address if tasks|length >= i else '' }}" readonly>
            </td>
            <td>
                <select class="form-select" style="width: 150px;" disabled>
                    <option value="">请选择执勤计划</option>
                    {% for plan in work_plans %}
                        <option value="{{ plan.id }}" {% if plan.id == (tasks[i - 1].work_plan_id if tasks|length >= i else '') %}selected{% endif %}>
                            {{ plan.name }}
                        </option>
                    {% endfor %}
                </select>
            </td>
            <td>
                <span class="badge bg-primary">{% if tasks|length >= i %}{{ tasks[i - 1].status }}{% else %}未开始{% endif %}</span>
            </td>
            <td>
                <button class="btn btn-info btn-sm edit-button">编辑</button>
                <button class="btn btn-success btn-sm">启动</button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
    // 编辑按钮逻辑
    document.querySelectorAll('.edit-button').forEach(button => {
        button.addEventListener('click', function() {
            const row = this.closest('tr');
            const inputs = row.querySelectorAll('input, select');
            const isEditing = this.textContent === '保存';

            // 切换可编辑状态
            inputs.forEach(input => {
                if (input.tagName === 'INPUT') {
                    input.readOnly = isEditing ? true : false;
                } else if (input.tagName === 'SELECT') {
                    input.disabled = isEditing ? true : false;
                }
            });

            // 更新按钮文本
            this.textContent = isEditing ? '编辑' : '保存';
        });
    });
</script>

<style>
    .table {
        table-layout: auto;
        width: 100%;
    }
    .table th, .table td {
        vertical-align: middle;
    }
    .form-control, .form-select {
        width: 100%; /* 确保输入框和选择框宽度一致 */
        box-sizing: border-box; /* 确保内边距不会影响宽度 */
    }
</style>
{% endblock %}
